# Живые картинки профиля: статистика + змейка.
# Всё собирается здесь и публикуется в ветку `output`, откуда README берёт картинки.
name: Profile assets

on:
  schedule:
    - cron: "0 */12 * * *" # каждые 12 часов
  workflow_dispatch: # кнопка «Run workflow» во вкладке Actions
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Статистика — первой: она создаёт dist/ от имени runner'а
      - name: Stats cards
        run: node scripts/build-stats.mjs --out dist
        env:
          # METRICS_TOKEN (необязательно) — PAT с read:user, чтобы учитывать приватные контрибуции
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#00E5FF&color_dots=#161B22,#0B3C47,#00788A,#00B3CC,#00E5FF
            dist/snake-light.svg?palette=github-light&color_snake=#FF2E88&color_dots=#EBEDF0,#B8F3FF,#5CE1F5,#00B3CC,#007A8C

      - name: Publish to `output` branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update profile assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
